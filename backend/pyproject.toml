[project]
name = "ecommerce-backend"
version = "0.1.0"
description = "FastAPI backend for the e-commerce platform"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# main.py inserts `backend/` into sys.path before importing `app.*` so it can be
# launched directly (`python app/main.py`); that legitimately breaks "imports first".
"app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
# strict mode is the target; plugins for pydantic
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
